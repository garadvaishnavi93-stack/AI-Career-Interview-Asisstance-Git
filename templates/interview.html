{% extends "base.html" %}
{% block content %}
<div class="progress"><span style="width: {{ (number / total * 100)|int }}%"></span></div>
<section class="card">
  <p class="eyebrow">{{ role }} - QUESTION {{ number }} OF {{ total }}</p>
  <h1>{{ item.question }}</h1>
  <p class="topic">Topic: {{ item.topic }}</p>
  <form method="post">
    <label>Your answer<textarea id="answer" name="answer" rows="11" required placeholder="Write a clear answer. Add a real example when possible."></textarea></label>
    <p id="counter" class="muted">0 characters</p>
    <button type="submit">Submit answer and continue</button>
  </form>
</section>
{% endblock %}
